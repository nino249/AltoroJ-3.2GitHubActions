name: Build AltoroJ

on:
  push:
    branches: [ "AltoroJ-3.2" ]
  pull_request:
    branches: [ "AltoroJ-3.2" ]
  workflow_dispatch: {}

# Needed so appscan-sast-action can post its summary as a PR comment.
# Safe to leave in even if you never open PRs against this branch.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AltoroJ-3.2
        uses: actions/checkout@v4

      # AltoroJ's build.gradle uses sourceCompatibility/targetCompatibility 1.7.
      # Temurin 8 is the newest widely-available JDK that still compiles for
      # that old a source/target level without extra flags.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # This repo has no gradlew/gradle wrapper checked in, so we install
      # Gradle ourselves. The build.gradle still uses the legacy
      # 'compile' / 'providedCompile' configurations, which were removed
      # in Gradle 7. Gradle 6.9.4 is the last 6.x release and is the
      # newest version that will still parse this file as-is.
      - name: Set up Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.4'

      - name: Build WAR
        run: gradle war --no-daemon --stacktrace

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: altoromutual-war
          path: build/libs/altoromutual.war
          if-no-files-found: error

  sca-scan:
    name: SCA scan (HCL AppScan on Cloud)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AltoroJ-3.2
        uses: actions/checkout@v4

      # Put the WAR back where the build produced it so the action can
      # analyze the actual compiled artifact (jars in WEB-INF/lib +
      # whatever got packaged) rather than re-resolving dependencies
      # from source alone.
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: altoromutual-war
          path: build/libs

      - name: Run AppScan SCA scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.8
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          # application_id: ${{ secrets.ASOC_APPLICATION_ID }}
          application_id: ${{ vars.ASOC_APPLICATION_ID }} 
          # application_id: "10b03ad2-410f-47d5-80d9-168e016390f1"
          # SCA (Software Composition Analysis) only — skip SAST here since
          # the build job already exists separately; drop this line if you
          # want SAST + SCA together in one scan.
          open_source_only: true
          # Lets the scanner look at the .war (and the jars bundled inside
          # WEB-INF/lib) in addition to source, which is what actually
          # catches vulnerable open-source components at these old pinned
          # versions (commons-lang 2.5, log4j 1.2.16, derby 10.8.2.2, etc).
          scan_build_outputs: true
          scan_name: "AltoroJ-3.2 SCA - ${{ github.sha }}"
          wait_for_analysis: true
          fail_for_noncompliance: true
          failure_threshold: High
          github_token: ${{ github.token }}
